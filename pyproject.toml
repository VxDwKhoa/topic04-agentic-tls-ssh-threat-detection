[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topic04-agentic-tls-ssh-threat-detection"
version = "0.1.0"
description = "Topic 04 (NT219/NT2205) — Agentic ML/DL for Metadata-Only TLS/SSH Threat Detection, Hunting & Response"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
notebooks = [
    "nbformat>=5.9.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "nbformat>=5.9.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
]
xgb = [
    "xgboost>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.response" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
